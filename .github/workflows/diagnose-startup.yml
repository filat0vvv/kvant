name: Android 15 — проверка анимации kvantGram
on:
  push:
    branches: [codex/kvantgram-startup-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  animated-startup:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7bb31b41119a4e20d6b757e8ed0e4053b430d1f6
      - uses: actions/download-artifact@v4
        with:
          name: kvantGram-Android15-APK
          run-id: 41027082202
          github-token: ${{ github.token }}
          path: apk
      - name: Record through cold native initialization
        run: sed -i "s/'12',/'30',/" scripts/smoke_android15.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -memory 4096 -cores 2 -skin 720x1280 -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
            adb shell am force-stop com.google.android.apps.nexuslauncher
            python3 scripts/smoke_android15.py apk/kvantGram-Android15-arm64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvantGram-Android15-animation-checks
          path: startup-checks/
          if-no-files-found: error
