name: Android 15 — проверка анимации kvantGram
on:
  push:
    branches: [codex/kvantgram-startup-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  animated-startup:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e668aca54c8a32f7ef1d0e37e594e6eb77109092
      - uses: actions/download-artifact@v4
        with:
          name: kvantGram-Android15-APK
          run-id: 41023893681
          github-token: ${{ github.token }}
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: python3 scripts/smoke_android15.py apk/kvantGram-Android15-arm64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvantGram-Android15-animation-checks
          path: startup-checks/
          if-no-files-found: error
