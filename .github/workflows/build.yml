name: Сборка Kvant APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Название приложения'
        required: true
        default: 'Kvant'
      app_id:
        description: 'ID пакета (чтобы ставился отдельно от обычного TG)'
        required: true
        default: 'com.kvant.messenger'
      custom_channel:
        description: 'Твой Telegram-канал или юзернейм (без @)'
        required: false
        default: 'kvant_official'
      custom_link:
        description: 'Твоя ссылка в меню (сайт, бот или группа ВК)'
        required: false
        default: 'https://t.me/kvant_official'

permissions:
  contents: read

jobs:
  build-kvant:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 1. Освобождение места для NDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - name: 2. Скачивание зафиксированной базы exteraGram
        env:
          UPSTREAM_REVISION: 6f78031aafd7f27e0dfaa31a207715569a6df1a2
        run: |
          git init source_code
          git -C source_code remote add origin https://github.com/exteraSquad/exteraGram.git
          git -C source_code fetch --depth 1 origin "$UPSTREAM_REVISION"
          git -C source_code checkout --detach FETCH_HEAD
          git -C source_code submodule update --init --recursive

      - name: 3. Настройка Kvant и авто-прокси
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'Kvant' }}
          APP_ID: ${{ github.event.inputs.app_id || 'com.kvant.messenger' }}
          CHANNEL: ${{ github.event.inputs.custom_channel || 'kvant_official' }}
          LINK: ${{ github.event.inputs.custom_link || 'https://t.me/kvant_official' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 .github/scripts/patch_kvant.py

      - name: 4. Настройка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Генерация подписи APK
        working-directory: source_code
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kvant123 -keypass kvant123 \
            -dname "CN=Kvant, OU=Mobile, O=Kvant, L=City, S=State, C=US"

      - name: 6. Компиляция Kvant APK
        working-directory: source_code
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --no-daemon --no-configuration-cache --stacktrace

      - name: 7. Выгрузка готового Kvant.apk
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Kvant-Android-APK
          path: source_code/TMessagesProj/build/outputs/apk/afat/release/*.apk
