name: kvantGram — APK и проверки истории

on:
  push:
    branches: [codex/kvantgram-legacy]
  workflow_dispatch:
    inputs:
      app_name:
        description: Название приложения
        required: true
        default: kvantGram
      app_id:
        description: Отдельный пакет для сохранности данных старого kvantGram
        required: true
        default: com.kvant.messenger.ayu

permissions:
  contents: read
  actions: read
concurrency:
  group: kvantgram-ayu-${{ github.ref }}
  cancel-in-progress: true

env:
  AYU_COMMIT: 7013145676d36d82ee13c02a89f72097b7490dcd

jobs:
  build-ayu:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Скачать kvantGram
        uses: actions/checkout@v4
      - name: Проверить наличие API и постоянной подписи
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,re
          names=('TELEGRAM_API_ID','TELEGRAM_API_HASH','ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD')
          missing=[n for n in names if not os.environ.get(n)]
          if missing: raise SystemExit('Missing Actions secrets: '+', '.join(missing))
          if not re.fullmatch(r'[1-9][0-9]*',os.environ['TELEGRAM_API_ID']): raise SystemExit('Invalid TELEGRAM_API_ID')
          if not re.fullmatch(r'[a-fA-F0-9]{32}',os.environ['TELEGRAM_API_HASH']): raise SystemExit('Invalid TELEGRAM_API_HASH')
          PY
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Инструменты для AyuGram
        run: |
          sdkmanager 'platforms;android-33' 'build-tools;33.0.1' 'ndk;21.4.7075529' 'cmake;3.10.2.4988404'
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake bison
          python3 -m pip install 'Pillow==11.3.0'
      - name: Скачать публичную базу AyuGram
        run: |
          git init source_code
          git -C source_code remote add origin https://github.com/AyuGram/AyuGram4A.git
          git -C source_code fetch --depth 1 origin "$AYU_COMMIT"
          git -C source_code checkout --detach FETCH_HEAD
          test "$(git -C source_code rev-parse HEAD)" = "$AYU_COMMIT"
          # The unavailable proprietary submodule is deliberately not fetched.
          # Our open history classes replace its call sites in the next step.
          test -s source_code/TMessagesProj/jni/ffmpeg/arm64-v8a/libswscale.a
      - name: Подключить интерфейс, историю и брендинг kvantGram
        env:
          APP_NAME: ${{ inputs.app_name || 'kvantGram' }}
          APP_ID: ${{ inputs.app_id || 'com.kvant.messenger.ayu' }}
        run: python3 scripts/brand_ayu.py source_code
      - name: Скачать проверенные неизменённые native-библиотеки
        id: native_reference
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kvantGram-Android15-APK
          run-id: 41023893681
          github-token: ${{ github.token }}
          path: native-reference
      - name: Проверить соответствие и использовать native-библиотеки
        if: steps.native_reference.outcome == 'success'
        run: python3 scripts/reuse_native.py source_code native-reference
      - name: Настроить собственные API и подпись
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,json,base64
          from pathlib import Path
          p=Path('source_code/API_KEYS')
          p.write_text('APP_ID='+os.environ['TELEGRAM_API_ID']+'\nAPP_HASH='+json.dumps(os.environ['TELEGRAM_API_HASH'])+'\nMAPS_V2_API=\n')
          p.chmod(0o600)
          Path('source_code/local.properties').write_text('sdk.dir='+os.environ['ANDROID_HOME']+'\n')
          key=Path(os.environ['RUNNER_TEMP'])/'kvantgram-release.keystore'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True));key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('KVANT_KEYSTORE_PATH='+str(key)+'\n')
          PY
      - name: Кэш зависимостей Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: kvantgram-ayu-gradle-v1-${{ env.AYU_COMMIT }}
      - name: Проверить историю, режим призрака и собрать APK
        working-directory: source_code
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -list -keystore "$KVANT_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
          chmod +x gradlew
          ./gradlew :TMessagesProj:testAfatReleaseUnitTest --no-daemon --no-configuration-cache --max-workers=2 --stacktrace
          ./gradlew :TMessagesProj:assembleAfatRelease --no-daemon --no-configuration-cache --max-workers=2 --stacktrace
      - name: Проверить и подготовить готовый APK
        env:
          APP_NAME: ${{ inputs.app_name || 'kvantGram' }}
          APP_ID: ${{ inputs.app_id || 'com.kvant.messenger.ayu' }}
        run: |
          mkdir -p dist
          if [ -f native-provenance.json ]; then cp native-provenance.json dist/; fi
          cp source_code/TMessagesProj/build/outputs/apk/afat/release/kvantGram-Android15-arm64.apk dist/
          "$ANDROID_HOME/build-tools/33.0.1/apksigner" verify --verbose dist/kvantGram-Android15-arm64.apk
          "$ANDROID_HOME/build-tools/33.0.1/aapt" dump badging dist/kvantGram-Android15-arm64.apk > dist/apk-info.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          info=Path('dist/apk-info.txt').read_text()
          assert "package: name='"+os.environ['APP_ID']+"'" in info
          assert "application-label:'"+os.environ['APP_NAME']+"'" in info
          assert "native-code: 'arm64-v8a'" in info
          PY
          sha256sum dist/kvantGram-Android15-arm64.apk > dist/SHA256SUMS.txt
          git -C source_code add -N -- TMessagesProj/src/main/java/com/kvant \
            TMessagesProj/src/main/java/org/telegram/messenger/AutoProxyManager.java \
            TMessagesProj/src/main/res/drawable-nodpi/kvant_logo.png \
            TMessagesProj/src/main/res/drawable-nodpi/kvant_mark.png \
            TMessagesProj/src/main/res/drawable/kvant_foreground.xml \
            TMessagesProj/src/main/res/drawable/kvant_splash_icon.xml \
            TMessagesProj/src/main/res/drawable/kvant_start_background.xml \
            TMessagesProj/src/main/res/values/kvant_brand.xml \
            TMessagesProj/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml \
            TMessagesProj/src/main/res/mipmap-*/ic_launcher_round.png \
            TMessagesProj/src/test
          git -C source_code diff --binary > dist/kvantGram-Ayu-source.patch
          git archive --format=zip --output=dist/kvantGram-Ayu-build-source.zip HEAD
          printf '%s\n' "$AYU_COMMIT" > dist/upstream-commit.txt
          echo 'kvantGram APK is available in Artifacts. This installs separately from the Telegram-FOSS edition.' >> "$GITHUB_STEP_SUMMARY"
      - name: Скачать kvantGram APK
        uses: actions/upload-artifact@v4
        with:
          name: kvantGram-Android15-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Сохранить результаты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvantGram-Ayu-test-results
          path: |
            source_code/TMessagesProj/build/test-results/
            source_code/TMessagesProj/build/reports/tests/
          if-no-files-found: ignore
      - name: Удалить временные ключи
        if: always()
        run: rm -f -- "$RUNNER_TEMP/kvantgram-release.keystore" "$GITHUB_WORKSPACE/source_code/API_KEYS"


  startup-android15:
    needs: build-ayu
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kvantGram-Android15-APK
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check release launch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -memory 4096 -cores 2 -skin 720x1280 -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: false
          script: |
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
            adb shell am force-stop com.google.android.apps.nexuslauncher
            python3 scripts/smoke_android15.py apk/kvantGram-Android15-arm64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kvantGram-Android15-startup-checks
          path: startup-checks/
          if-no-files-found: error
